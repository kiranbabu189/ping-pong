<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; --bg: #fff; --fg: #1d2129; --muted: #5b6271; --accent: #4f46e5; }
  @media (prefers-color-scheme: dark) { :root { --bg: #17181c; --fg: #e7e9ee; --muted: #a3a9b6; --accent: #8b85ff; } }
  body { margin: 0; width: 280px; padding: 14px; font: 13px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  h1 { font-size: 14px; margin: 0 0 8px; }
  label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
  .origin { font-family: ui-monospace, Menlo, monospace; word-break: break-all; }
  p { color: var(--muted); margin: 10px 0 0; font-size: 12px; }
  input { accent-color: var(--accent); margin-top: 2px; }
</style>
</head>
<body>
  <h1>api-pingpong</h1>
  <label><input type="checkbox" id="toggle"> <span>Enable on <span class="origin" id="origin">this site</span></span></label>
  <p id="note">The page reloads so recording starts before the site's own code. Toggle the panel with Alt+Shift+A.</p>
  <script src="popup.js"></script>
</body>
</html>
